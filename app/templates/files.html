{% extends 'base.html' %}

{% block main %}
<h1 class="page-header">Uploaded Files</h1>

{% include 'flash_messages.html' %}
<div class="uploaded-files">
<ul>
  {# Loop through the list of uploaded files and display them as links #}
  {% for image in image_list %}
    <li><img src="{{ url_for('get_image', filename=image) }}" alt="{{ image }}" width="200px"></li>
  {% endfor %}
</ul>
</div>
{% endblock %}
